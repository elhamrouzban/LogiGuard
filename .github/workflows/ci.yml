name: LogiGuard CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: logiguard_test
          POSTGRES_USER: logiguard
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logiguard -d logiguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://logiguard:test_password@localhost:5432/logiguard_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check code quality with Ruff
        run: python -m ruff check .

      - name: Create database tables
        run: python -m src.database.create_tables

      - name: Run tests
        run: python -m pytest -q