[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "logiguard"
version = "0.1.0"
description = "Logistics delay-risk prediction and operations copilot."
requires-python = ">=3.14,<3.15"

dependencies = [
    "fastapi==0.142.1",
    "pydantic==2.13.5",
    "sqlalchemy==2.1.1",
    "psycopg[binary]==3.3.6",

    "pandas==3.0.6",
    "joblib==1.6.0",
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",

    "requests==2.34.2",
    "streamlit==1.65.0",
    "uvicorn==0.54.0",

    "python-dotenv==1.2.4",
    "google-genai==2.29.0",
    "prometheus-fastapi-instrumentator==8.1.0",
    "evidently==0.7.23",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]